name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        run: cargo test --locked --target x86_64-unknown-linux-musl

      - name: Build and package
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl
          target/x86_64-unknown-linux-musl/release/sb-rotate --help
          tar -czf sb-rotate-linux-amd64.tar.gz \
            -C target/x86_64-unknown-linux-musl/release sb-rotate
          sha256sum sb-rotate-linux-amd64.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            sb-rotate-linux-amd64.tar.gz SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
