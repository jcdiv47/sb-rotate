name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

  msrv:
    name: Minimum Rust 1.89
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --locked --all-targets

  sing-box:
    name: Real sing-box ${{ matrix.version }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported release.
          - version: v1.14.0
            sha256: 2375de6999f4f56ab46b4fc5ddf26a6aba1d3e61a0f4e7ddec2f4690457d5f63
          # Newest tested stable release; bump deliberately.
          - version: v1.14.3
            sha256: e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee
          # Newest tested 1.15 prerelease; bump deliberately.
          - version: v1.15.0-alpha.12
            sha256: b107528ec7d989333d986573c097d840b9ef1afa9bb177f8eb03e0767f370514
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install checksum-pinned sing-box ${{ matrix.version }}
        run: .github/scripts/install-sing-box.sh "${{ matrix.version }}" "${{ matrix.sha256 }}"
      - run: cargo test --locked --test real_singbox -- --ignored
